<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">dshify — OpenCode to DeepSeek Harness, verified</title>
  <desc id="desc">Social preview card for the dshify repository: deterministic conversion from OpenCode to DeepSeek Harness with live composition verification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070C17"/>
      <stop offset="0.55" stop-color="#0B1326"/>
      <stop offset="1" stop-color="#10203C"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.58" stop-color="#B6D0FF"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8FB4FF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: "Inter", "DejaVu Sans", Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "DejaVu Sans Mono", monospace; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1080" cy="80" r="300" fill="url(#glow)"/>
  <circle cx="90" cy="600" r="280" fill="url(#glowBlue)"/>

  <!-- top rule / identity -->
  <rect x="80" y="70" width="220" height="30" rx="15" fill="#0F1C34" stroke="#274063"/>
  <circle cx="97" cy="85" r="4" fill="#2DD4BF"/>
  <text x="110" y="90" class="sans" font-size="11" font-weight="700" letter-spacing="2.4" fill="#9DB7DA">DEEPSEEK HARNESS</text>

  <text x="530" y="89" text-anchor="middle" class="mono" font-size="12" fill="#5C7698">github.com/Eatosin/dshify</text>

  <!-- wordmark -->
  <text x="600" y="300" text-anchor="middle" class="sans" font-size="150" font-weight="800" letter-spacing="-5" fill="url(#word)">dshify</text>

  <text x="600" y="365" text-anchor="middle" class="sans" font-size="34" font-weight="600" fill="#EAF2FF">Port. Verify. Ship.</text>
  <text x="600" y="407" text-anchor="middle" class="sans" font-size="20" fill="#8FA6C6">OpenCode skills, commands, personas and MCP → a verified DSH surface.</text>

  <!-- feature chips -->
  <g transform="translate(144 462)">
    <rect width="284" height="58" rx="12" fill="#0D1830" stroke="#28405F"/>
    <text x="22" y="25" class="mono" font-size="11" fill="#5EEAD4">01</text>
    <text x="22" y="44" class="sans" font-size="14" font-weight="600" fill="#DCE8FA">Deterministic output</text>
  </g>
  <g transform="translate(458 462)">
    <rect width="284" height="58" rx="12" fill="#0D1830" stroke="#28405F"/>
    <text x="22" y="25" class="mono" font-size="11" fill="#5EEAD4">02</text>
    <text x="22" y="44" class="sans" font-size="14" font-weight="600" fill="#DCE8FA">Live composition check</text>
  </g>
  <g transform="translate(772 462)">
    <rect width="284" height="58" rx="12" fill="#0D1830" stroke="#28405F"/>
    <text x="22" y="25" class="mono" font-size="11" fill="#5EEAD4">03</text>
    <text x="22" y="44" class="sans" font-size="14" font-weight="600" fill="#DCE8FA">Owned, conflict-safe writes</text>
  </g>

  <text x="600" y="565" text-anchor="middle" class="mono" font-size="12.5" fill="#6F87A8">scan · plan · apply · check · verify</text>
  <text x="600" y="592" text-anchor="middle" class="sans" font-size="11.5" letter-spacing="1.2" fill="#4C6384">DSH 0.2.2-rc.5  ·  NODE 22/24  ·  MIT</text>
</svg>
