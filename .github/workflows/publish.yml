name: publish

# Release path: push a v* tag (or run manually). Requires the NPM_TOKEN repo
# secret: a Granular Access Token with "Read and write" + "All packages" and
# 2FA bypass enabled. Provenance needs the public repository and id-token.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Tag must match package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $expected"
            exit 1
          fi
      - name: Publish with provenance
        # Trusted Publishing: npm exchanges the GitHub OIDC token for publish
        # rights; no NPM_TOKEN secret is involved.
        shell: bash
        run: |
          set -o pipefail
          # npm's Sigstore/Rekor step can report a transient 409
          # (TLOG_CREATE_ENTRY_ERROR: "an equivalent entry already exists")
          # when Rekor is slow and the client retries its own first attempt.
          # A fresh publish process normally succeeds; retry only that error.
          for attempt in 1 2 3; do
            echo "publish attempt $attempt"
            if npm publish --provenance --access public 2>&1 | tee /tmp/publish.log; then
              exit 0
            fi
            if grep -qE 'TLOG_CREATE_ENTRY_ERROR|equivalent entry already exists' /tmp/publish.log; then
              echo "transient transparency-log conflict; retrying in 20s"
              sleep 20
              continue
            fi
            echo "non-transient publish failure"
            exit 1
          done
          echo "publish failed after 3 attempts"
          exit 1
